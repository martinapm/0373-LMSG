<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet" type="text/css">
    <title>Contacto - SecretBeauty</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
        <p>Ponte en contacto con nosotros</p>
    </header>
    <nav>
        <ul>
            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="articulos.html">Artículos</a></li>
        </ul>
    </nav>
    <main>
        <h2>Formulario de Contacto</h2>
        <form action="mailto:tarea2@foc.es" method="post" enctype="text/plain">
            <label for="nombre">Nombre</label><br>
            <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre"><br>
            <span class="error-message" id="nombre-error">El nombre es obligatorio*</span><br><br>

            <label for="apellidos">Apellidos</label><br>
            <input type="text" id="apellidos" name="apellidos" required placeholder="Escribe tus apellidos"><br>
            <span class="error-message" id="apellidos-error">Los apellidos son obligatorios*</span><br><br>

            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" required placeholder="mailto:tarea2@foc.es"><br>
            <span class="error-message" id="email-error">Por favor, introduce un email válido</span><br><br>

            <label for="edad">Edad</label><br>
            <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Edad"><br><br>

            <label for="mensaje">Mensaje</label><br>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..."></textarea><br><br>

            <button type="submit">Enviar</button><br><br>
        </form>
    </main>
    <footer>
        <p>Martina Pérez Muñoz 78003602E</p>
    </footer>
</body>
</html>
