    <h2> Ejercicio7: Verificar numero primo </h2>
</body>
    <script>
       
       const numero = 29;


let esPrimo = true;


if (numero <= 1) {
    esPrimo = false;
} else {
    for (let i = 2; i < numero; i++) {
        if (numero % i === 0) {
            esPrimo = false;
            break;
        }
    }
}

document.write("El numero primo es " +numero);
</script>
