<!DOCTYPE html>
<head>
    <title> EJERCICIOS - EJ1 </title>
</head>
    <body> 
        <h2> Ejercicio1: Tablas de Multiplicar</h2>
<p>
    <script>
        var numero = 5;
        resultado = "";
        for (var i = 1; i <=10; i++){
            resultado += numero + ' x ' + i + ' = ' + (numero * i) + '<br>';
        }
        document.write(resultado);
    </script>
</p>
</body>
</html>
