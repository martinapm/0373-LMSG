<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset ="UFT-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJERCICIOS - EJ8 </title>
</head>
<body>
    <h2> Ejercicio8: Lista de nombres </h2>
</body>
    <script>

        const nombres = ["Ana", "Luis", "Pedro", "Marta"];
        const lista = document.createElementById("lista-nombres");
        nombres.forEach(nombre => {
            const item = document.creatElement("li");
            item.textContent = nombre;
            lista.appendChild(item);
        });

</script>
</body>
</html>
